<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 即時天氣顧問</title><link rel="stylesheet" href="/style.css"></head><body><main><p class="eyebrow">LIVE WEATHER + GROQ AI</p><h1>AI 即時天氣顧問</h1><p>輸入城市或地標，取得即時天氣，再由 AI 提供外出建議。</p><section class="grid"><form id="form" class="panel"><label for="city">城市或地標</label><input id="city" maxlength="80" placeholder="MountFuji、LAX、中國浙江省浙江市；留白依連線位置判定"><label for="question">想問什麼？</label><textarea id="question" maxlength="500">請依目前天氣提供穿著、雨具與外出建議。</textarea><label for="temperature">Temperature：<output id="value">0.3</output></label><input id="temperature" type="range" min="0.1" max="1" step="0.1" value="0.3"><button id="submit">查詢並分析</button></form><section class="panel"><h2>AI 回覆</h2><p id="status">等待查詢</p><div id="answer">結果會顯示在這裡。</div><details><summary>天氣資料與 DEBUG</summary><pre id="debug"></pre></details></section></section></main><footer><a href="https://sadsailor-xshop.manus.space/">106084164 汪文彥 Sam</a></footer><script src="/app.js"></script></body></html>
