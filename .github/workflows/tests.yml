name: Python tests / Python 測試
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [weather-advisor, ai-tool-assistant]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ${{ matrix.project }}/functions/requirements-dev.txt
      - run: python -m pytest ${{ matrix.project }}/functions
